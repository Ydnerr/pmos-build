name: Build postmarketOS rolex

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel pmaports (edge = main)"
        required: false
        type: choice
        options: ["edge", "v26.06"]
        default: "edge"
      device:
        description: "Device pmbootstrap (generic msm89x7, dipakai rolex)"
        required: false
        type: string
        default: "qcom-msm89x7"
      ui:
        description: "Tampilan (RAM 2 GB: pilih yang ringan)"
        required: false
        type: choice
        options: ["phosh", "xfce4", "sxmo-de-sway", "plasma-mobile", "none"]
        default: "phosh"
      username:
        description: "Username"
        required: false
        type: string
        default: "user"
      password:
        description: "Password awal (terlihat di UI Actions, ganti dengan passwd setelah boot)"
        required: false
        type: string
        default: "147147"
      hostname:
        description: "Hostname"
        required: false
        type: string
        default: "rolex"
      extra_packages:
        description: "Paket tambahan, pisah koma (contoh: openssh,nano,iwd)"
        required: false
        type: string
        default: "nano,openssh"
      wifi_ssid:
        description: "SSID WiFi untuk auto-konek saat boot (kosongkan kalau tidak perlu)"
        required: false
        type: string
        default: ""
      wifi_pass:
        description: "Password WiFi (terlihat di UI Actions, jangan pakai password penting)"
        required: false
        type: string
        default: ""
      patch_touch_dtb:
        description: "Patch DTB touchscreen FocalTech untuk Redmi 4A (rolex)"
        required: false
        type: choice
        options: ["true", "false"]
        default: "true"
      touch_compatible:
        description: "Compatible string touchscreen FocalTech di DTS"
        required: false
        type: choice
        options: ["edt,edt-ft5406", "edt,edt-ft5306", "focaltech,fts"]
        default: "edt,edt-ft5406"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Install dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y git openssl android-sdk-libsparse-utils device-tree-compiler python3
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git "$HOME/pmbootstrap"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$HOME/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone pmaports
        env:
          IN_CHANNEL: ${{ inputs.channel }}
        run: |
          BRANCH="$IN_CHANNEL"
          [ "$IN_CHANNEL" = "edge" ] && BRANCH="main"
          WORK="$HOME/.local/var/pmbootstrap"
          mkdir -p "$WORK/cache_git"
          PM="$WORK/cache_git/pmaports"
          git clone https://gitlab.postmarketos.org/postmarketOS/pmaports.git "$PM"
          git -C "$PM" fetch origin main
          if [ "$BRANCH" != "main" ]; then
            git -C "$PM" checkout -B "$BRANCH" "origin/$BRANCH"
          fi
          echo "== branch =="; git -C "$PM" branch -a | head -20
          echo "== channels.cfg (origin/main) =="
          git -C "$PM" show origin/main:channels.cfg | head -30

          WV=$(grep -rhoE 'work_version *= *[0-9]+' "$HOME/pmbootstrap/pmb" 2>/dev/null | head -1 | grep -oE '[0-9]+$' || true)
          echo "${WV:-8}" > "$WORK/version"
          echo "work version: $(cat "$WORK/version")"

          pmbootstrap --version

      - name: Konfigurasi pmbootstrap
        env:
          IN_DEVICE: ${{ inputs.device }}
          IN_UI: ${{ inputs.ui }}
          IN_USER: ${{ inputs.username }}
          IN_HOST: ${{ inputs.hostname }}
          IN_EXTRA: ${{ inputs.extra_packages }}
        run: |
          mkdir -p "$HOME/.config"
          for f in pmbootstrap_v3.cfg pmbootstrap.cfg; do
            cat > "$HOME/.config/$f" <<EOF
          [pmbootstrap]
          device = $IN_DEVICE
          ui = $IN_UI
          user = ${IN_USER:-user}
          hostname = $IN_HOST
          extra_packages = $IN_EXTRA
          nonfree_firmware = True
          work = $HOME/.local/var/pmbootstrap
          EOF
          done
          pmbootstrap config

      - name: Build image (pmbootstrap install)
        env:
          IN_PASS: ${{ inputs.password }}
          IN_EXTRA: ${{ inputs.extra_packages }}
        run: |
          EXTRA="openssh,${IN_EXTRA}"
          pmbootstrap --timeout 3600 -y install --password "${IN_PASS:-147147}" --add "$EXTRA"

      - name: Patch DTB touchscreen FocalTech dan setup rootfs
        env:
          IN_SSID: ${{ inputs.wifi_ssid }}
          IN_WPASS: ${{ inputs.wifi_pass }}
          IN_PATCH_DTB: ${{ inputs.patch_touch_dtb }}
          IN_TOUCH_COMPAT: ${{ inputs.touch_compatible }}
          IN_DEVICE: ${{ inputs.device }}
        run: |
          RD="$HOME/.local/var/pmbootstrap/chroot_native/home/pmos/rootfs"
          sudo ls -lh "$RD" || true

          IMG=$(sudo find "$RD" -maxdepth 1 -type f -name '*-root.img' | head -1)
          [ -z "$IMG" ] && IMG=$(sudo find "$RD" -maxdepth 1 -type f -name '*.img' ! -name '*-boot.img' | head -1)
          if [ -z "$IMG" ]; then
            echo "WARNING: image rootfs tidak ketemu, step ini dilewati"
            exit 0
          fi
          echo "rootfs: $IMG"

          if sudo file "$IMG" | grep -qi "sparse"; then
            sudo simg2img "$IMG" /tmp/rootfs.raw
            sudo mv /tmp/rootfs.raw "$IMG"
          fi

          R=/mnt/rootfs
          B=/mnt/bootpart
          sudo mkdir -p "$R" "$B"

          LOOP=$(sudo losetup -fP --show "$IMG")
          sudo partprobe "$LOOP" 2>/dev/null || true
          sleep 2
          lsblk -f "$LOOP" || true

          MOUNTED=0
          BOOT_MOUNTED=0
          for P in "${LOOP}"p*; do
            [ -e "$P" ] || continue
            if [ "$MOUNTED" != "1" ] && sudo mount "$P" "$R" 2>/dev/null; then
              if [ -f "$R/etc/os-release" ]; then
                echo "rootfs ada di $P"
                MOUNTED=1
                continue
              fi
              sudo umount "$R"
            fi
          done

          for P in "${LOOP}"p*; do
            [ -e "$P" ] || continue
            if mountpoint -q "$P" 2>/dev/null; then
              continue
            fi
            if sudo mount "$P" "$B" 2>/dev/null; then
              if sudo find "$B" -maxdepth 4 -name '*.dtb' 2>/dev/null | grep -q .; then
                echo "boot partition ada di $P"
                BOOT_MOUNTED=1
                break
              fi
              sudo umount "$B"
            fi
          done

          if [ "$MOUNTED" != "1" ]; then
            echo "WARNING: partisi rootfs tidak ketemu, step ini dilewati"
            sudo losetup -d "$LOOP"
            exit 0
          fi

          if [ "$IN_PATCH_DTB" = "true" ]; then
            echo "== Cari file DTB untuk patch touchscreen =="
            DTB_FILES=$(sudo find "$R/boot" "$B" -type f -name '*.dtb' 2>/dev/null \
              | grep -iE 'msm8917|rolex|msm8937|msm8953|qcom' || true)
            [ -z "$DTB_FILES" ] && DTB_FILES=$(sudo find "$R/boot" "$B" -type f -name '*.dtb' 2>/dev/null || true)
            echo "$DTB_FILES"

            cat <<'PYEOF' > /tmp/patch_dts.py
          import re, sys

          path, compat = sys.argv[1], sys.argv[2]
          with open(path, "r", encoding="utf-8", errors="ignore") as f:
              src = f.read()

          orig = src

          def enable_touch_block(match):
              block = match.group(0)
              if re.search(r'touchscreen|goodix|ft5|edt|focaltech', block, re.I):
                  block = re.sub(r'status\s*=\s*"disabled"\s*;', 'status = "okay";', block)
                  block = re.sub(
                      r'compatible\s*=\s*"[^"]*(goodix|ft5|edt|focaltech|melfas|synaptics)[^"]*"\s*;',
                      f'compatible = "{compat}";',
                      block,
                      flags=re.I
                  )
              return block

          src = re.sub(r'touchscreen[^{]*\{[\s\S]*?\n\t*\};', enable_touch_block, src)

          src = re.sub(
              r'(touchscreen@[0-9a-fA-F]+\s*\{[\s\S]*?)status\s*=\s*"disabled"\s*;',
              r'\1status = "okay";',
              src
          )
          src = re.sub(
              r'(touchscreen@[0-9a-fA-F]+\s*\{[\s\S]*?)compatible\s*=\s*"[^"]+"\s*;',
              rf'\1compatible = "{compat}";',
              src
          )

          if "touchscreen@" not in src and re.search(r'i2c@78b7000\s*\{', src):
              touch_node = f'''
          \t\ttouchscreen@38 {{
          \t\t\tcompatible = "{compat}";
          \t\t\treg = <0x38>;
          \t\t\tinterrupt-parent = <&tlmm>;
          \t\t\tinterrupts = <65 0x2008>;
          \t\t\treset-gpios = <&tlmm 64 0x01>;
          \t\t\tstatus = "okay";
          \t\t}};
          '''
              src = re.sub(r'(i2c@78b7000\s*\{)', r'\1' + touch_node, src, count=1)

          if src != orig:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(src)
              print("DTS berhasil dimodifikasi")
          else:
              print("Tidak ada perubahan pola otomatis pada DTS ini")
          PYEOF

            PATCHED_COUNT=0
            for DTB in $DTB_FILES; do
              [ -f "$DTB" ] || continue
              DTS_TMP="/tmp/target_patch.dts"
              DTB_TMP="/tmp/target_patched.dtb"
              sudo rm -f "$DTS_TMP" "$DTB_TMP"

              if ! sudo dtc -I dtb -O dts -o "$DTS_TMP" "$DTB" 2>/dev/null; then
                continue
              fi

              if grep -qiE 'touchscreen|goodix|ft5|edt|i2c@' "$DTS_TMP"; then
                echo "Memproses DTB: $DTB (compatible target: $IN_TOUCH_COMPAT)"
                sudo cp "$DTB" "${DTB}.bak"
                python3 /tmp/patch_dts.py "$DTS_TMP" "$IN_TOUCH_COMPAT"

                if sudo dtc -I dts -O dtb -o "$DTB_TMP" "$DTS_TMP" 2>/dev/null; then
                  sudo cp "$DTB_TMP" "$DTB"
                  PATCHED_COUNT=$((PATCHED_COUNT + 1))
                  echo "OK: DTB ter-compile ulang -> $DTB"
                else
                  echo "WARNING: gagal compile ulang $DTS_TMP, kembalikan backup"
                  sudo cp "${DTB}.bak" "$DTB"
                fi
              fi
              sudo rm -f "${DTB}.bak"
            done
            echo "Total DTB ter-patch: $PATCHED_COUNT"
          fi

          if [ -d "$R/usr/lib/systemd/system" ] || [ -d "$R/etc/systemd/system" ]; then
            echo "Init system terdeteksi: systemd"
            sudo mkdir -p "$R/etc/systemd/system/multi-user.target.wants"
            if [ -f "$R/usr/lib/systemd/system/sshd.service" ]; then
              sudo ln -sf /usr/lib/systemd/system/sshd.service "$R/etc/systemd/system/multi-user.target.wants/sshd.service"
              echo "OK: systemd sshd.service diaktifkan"
            elif [ -f "$R/lib/systemd/system/sshd.service" ]; then
              sudo ln -sf /lib/systemd/system/sshd.service "$R/etc/systemd/system/multi-user.target.wants/sshd.service"
              echo "OK: systemd sshd.service diaktifkan"
            else
              echo "WARNING: unit file sshd.service tidak ditemukan"
            fi
          elif [ -d "$R/etc/init.d" ]; then
            echo "Init system terdeteksi: OpenRC"
            sudo mkdir -p "$R/etc/runlevels/default"
            sudo ln -sf /etc/init.d/sshd "$R/etc/runlevels/default/sshd"
          fi

          if [ -n "$IN_SSID" ]; then
            CONN="$R/etc/NetworkManager/system-connections/auto-wifi.nmconnection"
            sudo mkdir -p "$R/etc/NetworkManager/system-connections"
            printf '[connection]\nid=%s\ntype=wifi\nautoconnect=true\n\n[wifi]\nmode=infrastructure\nssid=%s\n\n[wifi-security]\nkey-mgmt=wpa-psk\npsk=%s\n\n[ipv4]\nmethod=auto\n\n[ipv6]\nmethod=auto\n' \
              "$IN_SSID" "$IN_SSID" "$IN_WPASS" | sudo tee "$CONN" > /dev/null
            sudo chmod 600 "$CONN"
            echo "WiFi auto-konek dipasang untuk SSID: $IN_SSID"
          fi

          echo "== cek hasil =="
          sudo ls -l "$R/etc/systemd/system/multi-user.target.wants/" 2>/dev/null | grep -i ssh || true
          sudo ls -l "$R/etc/runlevels/default/" 2>/dev/null | grep -i ssh || true
          echo "== paket terpasang yang relevan =="
          sudo grep -E '^P:(openssh|nano|networkmanager|phosh|postmarketos-ui-phosh)' "$R/lib/apk/db/installed" || echo "tidak ada yang cocok"

          sudo sync
          if [ "$BOOT_MOUNTED" = "1" ]; then
            sudo umount "$B" || true
          fi
          sudo umount "$R"
          sudo losetup -d "$LOOP"

      - name: Rebuild initramfs jika DTB dipatch
        if: inputs.patch_touch_dtb == 'true'
        env:
          IN_DEVICE: ${{ inputs.device }}
        run: |
          pmbootstrap chroot --suffix="rootfs_${IN_DEVICE}" -- mkinitfs || true
          pmbootstrap chroot --suffix="native" -- mkinitfs || true

      - name: Export hasil
        run: |
          mkdir -p out
          pmbootstrap export
          cp -L /tmp/postmarketOS-export/* out/ 2>/dev/null || true

          sudo find "$HOME/.local/var/pmbootstrap" -type f \
            \( -name 'lk2nd*.img' -o -name 'lk2nd*.mbn' \) 2>/dev/null \
            | while read -r f; do
                echo "lk2nd ketemu: $f"
                sudo cp "$f" out/
              done

          sudo find "$HOME/.local/var/pmbootstrap/chroot_native/home/pmos/rootfs" \
            -maxdepth 1 -type f -name '*.img' 2>/dev/null \
            | while read -r f; do
                echo "rootfs ketemu: $f"
                sudo cp "$f" out/
              done

          sudo chown -R "$USER":"$USER" out
          ls -lh out/

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: pmos-rolex
          path: out/
          compression-level: 6
          if-no-files-found: error
