name: Build Mobian-style (Debian + Phosh) rolex

# Catatan: Mobian tidak mendukung msm8917/rolex secara resmi. Workflow ini
# membuat rootfs Debian + Phosh (basis Mobian) dan memakai kernel + DTB + firmware
# dari paket postmarketOS (device-qcom-msm89x7). Boot lewat lk2nd + extlinux.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Rilis Debian"
        required: false
        type: choice
        options: ["trixie", "bookworm"]
        default: "trixie"
      pmos_channel:
        description: "Channel pmOS sumber kernel/firmware"
        required: false
        type: choice
        options: ["edge", "v25.12", "v26.06"]
        default: "edge"
      username:
        description: "Username (uid 1000, dipakai autologin phosh)"
        required: false
        type: string
        default: "user"
      password:
        description: "Password (terlihat di UI Actions, ganti dengan passwd setelah boot)"
        required: false
        type: string
        default: "147147"
      hostname:
        description: "Hostname"
        required: false
        type: string
        default: "rolex"
      extra_packages:
        description: "Paket Debian tambahan, pisah spasi"
        required: false
        type: string
        default: "nano htop"
      image_size_gb:
        description: "Ukuran image GB (harus muat di userdata)"
        required: false
        type: string
        default: "4"
      wifi_ssid:
        description: "SSID WiFi auto-konek (kosongkan kalau tidak perlu)"
        required: false
        type: string
        default: ""
      wifi_pass:
        description: "Password WiFi"
        required: false
        type: string
        default: ""
      patch_touch_dtb:
        description: "Patch DTB touchscreen"
        required: false
        type: choice
        options: ["true", "false"]
        default: "true"
      touch_compatible:
        description: "Compatible string touchscreen FocalTech"
        required: false
        type: choice
        options: ["focaltech,ft5426", "edt,edt-ft5506", "edt,edt-ft5406", "edt,edt-ft5306"]
        default: "focaltech,ft5426"
      touch_ic:
        description: "IC touch yang DIPAKAI"
        required: false
        type: choice
        options: ["focaltech", "goodix"]
        default: "focaltech"
      reset_polarity:
        description: "Polarity reset-gpios (default = bawaan DTB)"
        required: false
        type: choice
        options: ["default", "active-low", "active-high"]
        default: "default"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-binfmt binfmt-support rsync parted \
            e2fsprogs android-sdk-libsparse-utils device-tree-compiler python3 dosfstools
          sudo systemctl restart systemd-binfmt || true

      - name: Ambil kernel, DTB, firmware dari pmOS (via Alpine apk)
        env:
          IN_CH: ${{ inputs.pmos_channel }}
        run: |
          mkdir -p kernel
          docker run --rm -e CH="$IN_CH" -v "$PWD/kernel:/out" alpine:edge sh -ec '
            AL="https://dl-cdn.alpinelinux.org/alpine/edge"
            # postmarketOS direname jadi Nura: mirror pindah ke mirror.nura.eco
            if [ "$CH" = edge ]; then CS="edge master"; else CS="$CH"; fi
            PM=""
            for B in https://mirror.nura.eco/postmarketos https://mirror.postmarketos.org/postmarketos; do
              for C in $CS; do
                if wget -q -O /dev/null "$B/$C/aarch64/APKINDEX.tar.gz"; then PM="$B/$C"; break 2; fi
                echo "tidak ada: $B/$C/aarch64/APKINDEX.tar.gz"
              done
            done
            [ -n "$PM" ] || { echo "::error::APKINDEX pmOS/Nura tidak ketemu di semua mirror"; exit 1; }
            echo "Pakai mirror: $PM"
            mkdir -p /out/etc/apk
            run() { apk --arch aarch64 --allow-untrusted --no-scripts --no-cache --root /out --initdb \
                      -X "$PM" -X "$AL/main" -X "$AL/community" "$@"; }
            run add device-qcom-msm89x7 || run add linux-postmarketos-qcom-msm89x7
          '
          sudo chown -R "$USER":"$USER" kernel
          echo "== vmlinuz =="; find kernel -name 'vmlinuz*' -type f
          echo "== dtb rolex =="; find kernel -name '*xiaomi-rolex*.dtb'
          echo "== modules =="; find kernel -type d -name modules -path '*lib*'
          echo "== firmware =="; find kernel -maxdepth 4 -type d -name firmware

      - name: Debootstrap Debian arm64
        env:
          IN_SUITE: ${{ inputs.suite }}
        run: |
          sudo debootstrap --arch=arm64 --foreign --variant=minbase \
            --components=main,non-free-firmware "$IN_SUITE" rootfs http://deb.debian.org/debian
          sudo cp "$(command -v qemu-aarch64-static || command -v qemu-aarch64)" rootfs/usr/bin/qemu-aarch64-static
          sudo chroot rootfs /debootstrap/debootstrap --second-stage

      - name: Konfigurasi rootfs (Phosh, user, kernel, initramfs)
        env:
          IN_SUITE: ${{ inputs.suite }}
          IN_USER: ${{ inputs.username }}
          IN_PASS: ${{ inputs.password }}
          IN_HOST: ${{ inputs.hostname }}
          IN_EXTRA: ${{ inputs.extra_packages }}
          IN_SSID: ${{ inputs.wifi_ssid }}
          IN_WPASS: ${{ inputs.wifi_pass }}
        run: |
          R="$PWD/rootfs"
          ch() { sudo chroot "$R" /usr/bin/env DEBIAN_FRONTEND=noninteractive LANG=C.UTF-8 "$@"; }

          sudo mount --bind /dev "$R/dev"
          sudo mount -t proc proc "$R/proc"
          sudo mount -t sysfs sys "$R/sys"
          sudo mount -t devpts devpts "$R/dev/pts"

          sudo tee "$R/etc/apt/sources.list" > /dev/null <<EOF
          deb http://deb.debian.org/debian $IN_SUITE main non-free-firmware
          deb http://deb.debian.org/debian $IN_SUITE-updates main non-free-firmware
          deb http://security.debian.org/debian-security $IN_SUITE-security main non-free-firmware
          EOF

          ch apt-get update
          ch apt-get install -y --no-install-recommends \
            systemd-sysv udev dbus sudo openssh-server network-manager wpasupplicant \
            initramfs-tools e2fsprogs kmod locales ca-certificates iproute2 iputils-ping \
            parted phosh phoc squeekboard gnome-console libgl1-mesa-dri $IN_EXTRA

          echo "$IN_HOST" | sudo tee "$R/etc/hostname" > /dev/null
          printf '127.0.0.1 localhost\n127.0.1.1 %s\n' "$IN_HOST" | sudo tee "$R/etc/hosts" > /dev/null

          ch useradd -m -u 1000 -s /bin/bash -G sudo,video,render,input,netdev,audio "$IN_USER"
          printf '%s:%s\n' "$IN_USER" "$IN_PASS" | sudo chroot "$R" chpasswd
          printf '%s:%s\n' root "$IN_PASS" | sudo chroot "$R" chpasswd

          # Kernel + modul + firmware dari pmOS
          MODROOT=$(find kernel -type d -name modules \( -path '*/usr/lib/*' -o -path '*/lib/*' \) | head -1)
          KVER=$(ls "$MODROOT" | head -1)
          echo "KVER=$KVER (dari $MODROOT)"
          [ -n "$KVER" ] || { echo "::error::modul kernel tidak ketemu"; exit 1; }
          sudo mkdir -p "$R/usr/lib/modules"
          sudo cp -a "$MODROOT/$KVER" "$R/usr/lib/modules/"
          FW=$(find kernel -maxdepth 4 -type d -name firmware \( -path '*/usr/lib/*' -o -path '*/lib/*' \) | head -1)
          if [ -n "$FW" ]; then
            sudo mkdir -p "$R/usr/lib/firmware"
            sudo cp -a "$FW"/. "$R/usr/lib/firmware/"
          else
            echo "::warning::firmware pmOS tidak ketemu (WiFi/GPU kemungkinan tidak jalan)"
          fi
          echo "$KVER" > kver.txt

          ch depmod -a "$KVER"
          echo 'MODULES=most' | sudo tee "$R/etc/initramfs-tools/conf.d/modules" > /dev/null
          ch update-initramfs -c -k "$KVER"
          ls -l "$R/boot"

          # fstab
          sudo tee "$R/etc/fstab" > /dev/null <<EOF
          LABEL=mobian_root / ext4 defaults,noatime 0 1
          LABEL=mobian_boot /boot ext2 defaults 0 2
          EOF

          # USB ethernet gadget (pengganti 172.16.42.1 ala pmOS) - belum teruji
          echo g_ether | sudo tee "$R/etc/modules-load.d/g_ether.conf" > /dev/null
          sudo mkdir -p "$R/etc/systemd/network" "$R/etc/NetworkManager/conf.d"
          sudo tee "$R/etc/systemd/network/10-usb0.network" > /dev/null <<EOF
          [Match]
          Name=usb0

          [Network]
          Address=172.16.42.1/24
          DHCPServer=yes
          EOF
          printf '[keyfile]\nunmanaged-devices=interface-name:usb0\n' | sudo tee "$R/etc/NetworkManager/conf.d/usb0.conf" > /dev/null
          printf '[connection]\nwifi.powersave = 2\n' | sudo tee "$R/etc/NetworkManager/conf.d/wifi-powersave.conf" > /dev/null

          if [ -n "$IN_SSID" ]; then
            CONN="$R/etc/NetworkManager/system-connections/auto-wifi.nmconnection"
            sudo mkdir -p "$R/etc/NetworkManager/system-connections"
            sudo tee "$CONN" > /dev/null <<EOF
          [connection]
          id=$IN_SSID
          type=wifi
          autoconnect=true

          [wifi]
          mode=infrastructure
          ssid=$IN_SSID
          band=bg
          powersave=2

          [wifi-security]
          key-mgmt=wpa-psk
          psk=$IN_WPASS

          [ipv4]
          method=auto

          [ipv6]
          method=auto
          EOF
            sudo chmod 600 "$CONN"
          fi

          ch systemctl enable ssh NetworkManager systemd-networkd || true
          if [ -f "$R/usr/lib/systemd/system/phosh.service" ]; then
            ch systemctl enable phosh
            echo "OK: phosh.service diaktifkan"
          else
            echo "::warning::phosh.service tidak ada, Phosh tidak autostart"
          fi

          sudo mkdir -p "$R/usr/local/bin"
          sudo tee "$R/usr/local/bin/touch-debug" > /dev/null <<'DBGEOF'
          #!/bin/sh
          # Kumpulkan log touchscreen sekali jalan: sudo touch-debug
          echo "== kernel =="; uname -r
          echo "== status node DT =="
          for a in 38 5d; do
            d=/proc/device-tree/soc@0/i2c@78b7000/touchscreen@$a
            if [ -d "$d" ]; then
              printf "@%s status=" "$a"
              if [ -f "$d/status" ]; then tr -d '\0' < "$d/status"; else printf "okay(default)"; fi
              printf "\n"
            fi
          done
          echo "== i2c devices =="; ls /sys/bus/i2c/devices
          echo "== input =="; grep -i -E "ft5|goodix|touch" /proc/bus/input/devices || echo "(tidak ada)"
          echo "== dmesg =="; dmesg | grep -i -E "ft5|edt|goodix|1-0038|1-005d|gpio_64|regulator|i2c" | tail -n 80
          DBGEOF
          sudo chmod 755 "$R/usr/local/bin/touch-debug"

          ch apt-get clean
          sudo rm -f "$R/usr/bin/qemu-aarch64-static"
          sudo umount "$R/dev/pts" "$R/dev" "$R/proc" "$R/sys"

      - name: Rakit image, extlinux, patch DTB
        env:
          IN_SIZE: ${{ inputs.image_size_gb }}
          IN_PATCH_DTB: ${{ inputs.patch_touch_dtb }}
          IN_TOUCH_COMPAT: ${{ inputs.touch_compatible }}
          IN_TOUCH_IC: ${{ inputs.touch_ic }}
          IN_RESET_POL: ${{ inputs.reset_polarity }}
        run: |
          R="$PWD/rootfs"
          KVER=$(cat kver.txt)
          IMG="$PWD/mobian-rolex.img"
          truncate -s "${IN_SIZE}G" "$IMG"
          sudo parted -s "$IMG" mklabel msdos \
            mkpart primary ext2 1MiB 257MiB \
            mkpart primary ext4 257MiB 100% \
            set 1 boot on
          LOOP=$(sudo losetup -fP --show "$IMG")
          sleep 2
          sudo mkfs.ext2 -q -L mobian_boot "${LOOP}p1"
          sudo mkfs.ext4 -q -L mobian_root "${LOOP}p2"

          sudo mkdir -p /mnt/img
          sudo mount "${LOOP}p2" /mnt/img
          sudo rsync -aHAX --exclude='/boot/*' "$R"/ /mnt/img/
          sudo mkdir -p /mnt/img/boot
          sudo mount "${LOOP}p1" /mnt/img/boot
          B=/mnt/img/boot

          VML=$(find kernel -name 'vmlinuz*' -type f | head -1)
          [ -n "$VML" ] || { echo "::error::vmlinuz tidak ketemu"; exit 1; }
          sudo cp "$VML" "$B/vmlinuz"
          sudo cp "$R/boot/initrd.img-$KVER" "$B/initrd.img"
          for D in $(find kernel -name '*xiaomi-rolex*.dtb'); do sudo cp "$D" "$B/"; done

          sudo mkdir -p "$B/extlinux"
          sudo tee "$B/extlinux/extlinux.conf" > /dev/null <<EOF
          timeout 1
          default mobian
          menu title Mobian rolex

          label mobian
              linux /vmlinuz
              initrd /initrd.img
              fdtdir /
              append root=LABEL=mobian_root rootwait rw console=tty0
          EOF

          if [ "$IN_PATCH_DTB" = "true" ]; then
            cat <<'PYEOF' > /tmp/patch_dts.py
          import re, sys

          path, compat = sys.argv[1], sys.argv[2]
          src = open(path, encoding="utf-8", errors="ignore").read()
          orig = src


          def block_end(s, i):
              depth = 1
              while i < len(s) and depth:
                  if s[i] == "{":
                      depth += 1
                  elif s[i] == "}":
                      depth -= 1
                  i += 1
              return i - 1


          def phandle_of(pattern, s):
              m = re.search(r"([\w,-]*" + pattern + r")\s*\{[^}]*?phandle\s*=\s*<(0x[0-9a-fA-F]+)>", s)
              if m:
                  print("  phandle %s -> %s" % (m.group(1), m.group(2)))
                  return m.group(2)
              return None


          def find_node(s, addr):
              m = re.search(r"i2c@78b7000\s*\{", s)
              if not m:
                  return None
              bs = m.end()
              be = block_end(s, bs)
              mn = re.search(r"[\w,-]+@%s\s*\{" % addr, s[bs:be])
              if not mn:
                  return None
              ns = bs + mn.end()
              return ns, block_end(s, ns)


          def set_reset_flag(s, addr, flag):
              if flag is None:
                  return s
              pos = find_node(s, addr)
              if not pos:
                  print("WARNING: node @%s tidak ketemu (reset flag dilewati)" % addr)
                  return s
              ns, ne = pos
              nb = s[ns:ne]
              mm = re.search(r"reset-gpios\s*=\s*<(\S+)\s+(\S+)\s+(\S+)>\s*;", nb)
              if not mm:
                  print("WARNING: reset-gpios di @%s tidak ketemu" % addr)
                  return s
              new = "reset-gpios = <%s %s %s>;" % (mm.group(1), mm.group(2), flag)
              nb = nb[:mm.start()] + new + nb[mm.end():]
              print("touchscreen@%s reset flag %s -> %s" % (addr, mm.group(3), flag))
              return s[:ns] + nb + s[ne:]


          def setprop(nb, prop, val):
              pat = r"\b%s\s*=\s*<[^>]*>\s*;" % re.escape(prop)
              line = "%s = <%s>;" % (prop, val)
              if re.search(pat, nb):
                  return re.sub(pat, line, nb, count=1)
              return "\n\t\t\t" + line + nb


          def set_status(s, addr, status):
              m = re.search(r"i2c@78b7000\s*\{", s)
              if not m:
                  print("WARNING: i2c@78b7000 tidak ketemu")
                  return s
              bs = m.end()
              be = block_end(s, bs)
              mn = re.search(r"[\w,-]+@%s\s*\{" % addr, s[bs:be])
              if not mn:
                  print("WARNING: node @%s tidak ketemu" % addr)
                  return s
              ns = bs + mn.end()
              ne = block_end(s, ns)
              nb = s[ns:ne]
              pat = r'status\s*=\s*"[^"]*"\s*;'
              if re.search(pat, nb):
                  nb = re.sub(pat, 'status = "%s";' % status, nb, count=1)
              else:
                  nb = '\n\t\t\tstatus = "%s";' % status + nb
              print("touchscreen@%s -> %s" % (addr, status))
              return s[:ns] + nb + s[ne:]


          ic = sys.argv[3] if len(sys.argv) > 3 else "focaltech"
          pol = sys.argv[4] if len(sys.argv) > 4 else "default"
          RESET = {"active-low": "0x1", "active-high": "0x0"}.get(pol)
          if ic == "goodix":
              src = set_status(src, "38", "disabled")
              src = set_status(src, "5d", "okay")
              src = set_reset_flag(src, "5d", RESET)
              if src != orig:
                  open(path, "w", encoding="utf-8").write(src)
                  print("DTS berhasil dimodifikasi (Goodix aktif, FocalTech off)")
              else:
                  print("Tidak ada perubahan pada DTS ini")
              sys.exit(0)

          m_i2c = re.search(r"i2c@78b7000\s*\{", src)
          if not m_i2c:
              print("WARNING: i2c@78b7000 tidak ketemu")
              sys.exit(0)

          start = m_i2c.end()
          end = block_end(src, start)
          body = src[start:end]
          m38 = re.search(r"[\w,-]+@38\s*\{", body)

          tlmm = phandle_of(r"pinctrl@1000000", src)
          l10 = phandle_of(r"[\w,-]*l10", src)
          l5 = phandle_of(r"[\w,-]*l5", src)
          print("regulator l10=%s l5=%s tlmm=%s" % (l10, l5, tlmm))

          if m38:
              s2 = start + m38.end()
              e2 = block_end(src, s2)
              nb = src[s2:e2]
              print("NODE LAMA touchscreen@38: {" + nb + "}")
              if l10:
                  nb = setprop(nb, "vcc-supply", l10)
              if l5:
                  nb = setprop(nb, "iovcc-supply", l5)
              nb = re.sub(r'status\s*=\s*"disabled"\s*;', 'status = "okay";', nb)
              nb = re.sub(r'compatible\s*=\s*"[^"]*"\s*;', 'compatible = "%s";' % compat, nb, count=1)
              src = src[:s2] + nb + src[e2:]
          else:
              if not tlmm:
                  print("WARNING: tlmm (pinctrl@1000000) tidak ketemu")
                  sys.exit(0)
              used = [int(x, 16) for x in re.findall(r"phandle\s*=\s*<(0x[0-9a-fA-F]+)>", src)]
              pin_ph = "0x%x" % (max(used) + 1)

              node = ['\n\t\ttouchscreen@38 {',
                      '\t\t\tcompatible = "%s";' % compat,
                      '\t\t\treg = <0x38>;',
                      '\t\t\tinterrupt-parent = <%s>;' % tlmm,
                      '\t\t\tinterrupts = <0x41 0x02>;',
                      '\t\t\treset-gpios = <%s 0x40 0x01>;' % tlmm,
                      '\t\t\ttouchscreen-size-x = <0x2d0>;',
                      '\t\t\ttouchscreen-size-y = <0x500>;',
                      '\t\t\tpinctrl-names = "default";',
                      '\t\t\tpinctrl-0 = <%s>;' % pin_ph]
              if l10:
                  node.append('\t\t\tvcc-supply = <%s>;' % l10)
              if l5:
                  node.append('\t\t\tiovcc-supply = <%s>;' % l5)
              node += ['\t\t\tstatus = "okay";', '\t\t};\n']

              head_end = body.find("{")
              head = body if head_end < 0 else body[:head_end]
              head2 = re.sub(r'status\s*=\s*"disabled"\s*;', 'status = "okay";', head, count=1)
              src = src[:start] + head2 + body[len(head):] + "\n".join(node) + src[end:]

              m_t = re.search(r"pinctrl@1000000\s*\{", src)
              te = block_end(src, m_t.end())
              pin = ('\n\t\tts-active-state {\n'
                     '\t\t\tpins = "gpio64", "gpio65";\n'
                     '\t\t\tfunction = "gpio";\n'
                     '\t\t\tdrive-strength = <0x02>;\n'
                     '\t\t\tbias-pull-up;\n'
                     '\t\t\tphandle = <%s>;\n'
                     '\t\t};\n') % pin_ph
              src = src[:te] + pin + src[te:]

          src = set_status(src, "5d", "disabled")
          src = set_reset_flag(src, "38", RESET)

          if src != orig:
              open(path, "w", encoding="utf-8").write(src)
              print("DTS berhasil dimodifikasi")
          else:
              print("Tidak ada perubahan pada DTS ini")
          PYEOF
            PATCHED_COUNT=0
            for DTB in $(sudo find "$B" -maxdepth 1 -type f -name '*xiaomi-rolex*.dtb'); do
              DTS_TMP=/tmp/target_patch.dts
              DTB_TMP=/tmp/target_patched.dtb
              sudo rm -f "$DTS_TMP" "$DTB_TMP"
              if ! dtc -I dtb -O dts -o "$DTS_TMP" "$DTB" 2>/tmp/dtc_err.log; then
                echo "WARNING: gagal decompile $DTB"; tail -n 5 /tmp/dtc_err.log
                continue
              fi
              grep -q 'i2c@78b7000' "$DTS_TMP" || continue
              echo "Memproses DTB: $DTB"
              python3 /tmp/patch_dts.py "$DTS_TMP" "$IN_TOUCH_COMPAT" "$IN_TOUCH_IC" "$IN_RESET_POL"
              if dtc -I dts -O dtb -o "$DTB_TMP" "$DTS_TMP" 2>/tmp/dtc_err.log; then
                sudo cp "$DTB_TMP" "$DTB"
                PATCHED_COUNT=$((PATCHED_COUNT + 1))
                for A in 38 5d; do
                  N=/soc@0/i2c@78b7000/touchscreen@$A
                  ST=$(fdtget "$DTB" "$N" status 2>/dev/null || echo "okay (default)")
                  RG=$(fdtget -t x "$DTB" "$N" reset-gpios 2>/dev/null || echo "-")
                  echo "   verifikasi @$A: status=$ST reset-gpios=$RG"
                done
              else
                echo "WARNING: gagal compile ulang"; tail -n 10 /tmp/dtc_err.log
              fi
            done
            echo "Total DTB ter-patch: $PATCHED_COUNT"
            if [ "$PATCHED_COUNT" -eq 0 ]; then
              echo "::error::Tidak ada DTB yang ter-patch. Cek log di atas."
              sudo umount /mnt/img/boot /mnt/img || true
              sudo losetup -d "$LOOP" || true
              exit 1
            fi
          fi

          sudo sync
          sudo umount /mnt/img/boot
          sudo umount /mnt/img
          sudo losetup -d "$LOOP"

          mkdir -p out
          img2simg "$IMG" out/mobian-rolex-sparse.img
          ls -lh out/

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: mobian-rolex
          path: out/
          compression-level: 6
          if-no-files-found: error
